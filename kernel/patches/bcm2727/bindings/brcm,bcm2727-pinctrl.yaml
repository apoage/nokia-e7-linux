%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/brcm,bcm2727-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom BCM2727B1 (RAPU) GENIO pin controller

maintainers:
  - nokia-e7-linux project

description: |
  Pin controller and GPIO block of the Broadcom BCM2727B1 (RAPU) SoC
  (Nokia E7-00).  The register file at 0x20200000 contains:

    - a pad function grid at +0x1810: 22 registers x 8 four-bit fields
      (176 pads, function codes 0-4; 0 is assumed GPIO)
    - per-bank WAKE trios at +0x1990 (banks 0-5) and +0x1ab0 (bank 6)
    - per-bank DATA trios at +0x19f0 (banks 0-4: input / set / clear)
    - per-bank EDGE pairs at +0x1a50 (write-only)
    - per-bank IRQ/direction blocks at +0x3400

  GPIO banks 0-4 (160 lines) are usable; banks 5-6 are wake-only.
  Function code names for codes 1-4 are not yet decoded; use the
  generic "alt1".."alt4" names.

properties:
  compatible:
    const: brcm,bcm2727b1-genio

  reg:
    maxItems: 1

  gpio-controller: true

  "#gpio-cells":
    const: 2

required:
  - compatible
  - reg
  - gpio-controller
  - "#gpio-cells"

additionalProperties: false

examples:
  - |
    pinctrl@20200000 {
        compatible = "brcm,bcm2727b1-genio";
        reg = <0x20200000 0x4000>;
        gpio-controller;
        #gpio-cells = <2>;
    };
...
